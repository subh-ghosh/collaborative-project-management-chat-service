spring.application.name=chat-service
server.port=8090

# Redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# MongoDB
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb+srv://sanketdeystudent_db_user:Sanket7044@cluster0.ivuzumv.mongodb.net/project_management?retryWrites=true&w=majority}
spring.data.mongodb.database=${DATABASE_NAME:project_management}

# Kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9094}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Kafka Consumer (for Background Persistence)
spring.kafka.consumer.group-id=chat-persistence-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.sprintsense.chatservice

# Custom Internal Configs
sprintsense.gateway.url=${NODE_URL:http://host.docker.internal:3000}
sprintsense.internal.secret=${INTERNAL_SECRET:sprintsense-super-secret-key-2026}
